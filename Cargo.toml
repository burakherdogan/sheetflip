[package]
name = "sheetflip"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Double-sided and booklet printing for printers without a duplex unit"
readme = "README.md"
repository = "https://github.com/burakherdogan/sheetflip"
homepage = "https://github.com/burakherdogan/sheetflip"
authors = ["Burak Hasan Erdoğan"]
keywords = ["printing", "duplex", "booklet", "cups", "pdf"]
categories = ["command-line-utilities"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread"] }
lopdf = "0.47"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
